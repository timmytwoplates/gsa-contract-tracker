# =============================================================================
# Daily eLibrary Refresh — fetch latest contract vehicle data from GSA eLibrary
# Runs at 9 AM UTC (~5 AM ET) per scheduling.daily_cron in config/config.yaml
# =============================================================================

name: Daily eLibrary Refresh

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  fetch-elib:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_elib pipeline
        run: python -m pipeline.fetch_elib
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ raw_data/
          git diff --cached --quiet || git commit -m "chore: daily eLibrary refresh $(date -u +%Y-%m-%d)"
          git push
